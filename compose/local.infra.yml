# Overlay: attach the local app stack to a locally-running Hill90 infra stack.
#
# Opt-in. `compose/local.yml` on its own stays fully standalone — this file only
# matters when the Hill90 infrastructure repo's local path (JON-41) is running.
#
#   ./scripts/local.sh up --infra
#   docker compose -f compose/local.yml -f compose/local.infra.yml \
#     --env-file .env.local up -d
#
# STATUS: superseded, and unreachable through the tooling. Do not assume it works.
#
# The command in the header above is the only way to run this file. scripts/local.sh
# does NOT use it — see the explicit note at scripts/local.sh:45 — because `--infra`
# now layers deploy/compose/overrides/local.*.yml on the PRODUCTION compose files
# instead of overlaying this fork. That change is the whole point of the override
# layer: an overlay on the fork exercises the fork, which is how the fork drifted.
#
# It is left in place rather than deleted because README.md documents it and the
# evidence for deleting it should be recorded before it goes, not after. What is
# known: no script, workflow or make target references it, only comments and prose
# do. If it goes, README.md needs updating in the same change.
#
# What changes:
#   * the three shared networks become `external` — infra owns them
#   * services join the same networks they join in production
#   * Traefik labels are added, so the app is reachable by hostname
#   * browser-facing URLs move from localhost:PORT to the Traefik hostnames
#
# Published ports stay. Compose cannot remove a port mapping in an overlay, and
# keeping them is useful: both http://localhost:13000 and the Traefik hostname
# reach the UI. The exception is postgres — see the note on that service.
#
# ---------------------------------------------------------------------------
# Contract with the infra repo
#
# Network ownership, from Hill90 deploy/compose/prod/docker-compose.infra.yml:
#
#   infra creates   <prefix>_edge, <prefix>_internal, <prefix>_agent_internal
#   the app creates <prefix>_agent_sandbox, <prefix>_app_internal
#
# Inherited from production, where docker-compose.api.yml is the sole creator
# of the sandbox network. Nothing in the infra compose references it.
#
# <prefix>_app_internal is not inherited from production — it exists because
# service names collide on the shared internal network. See its note below.
#
# These variables mirror the infra repo's .env.local so the two stacks agree.
# Defaults match the infra repo's own defaults, so an unset value here resolves
# the same way it does there:
#
#   NETWORK_PREFIX  hill90        infra sets hill90dev locally
#   BASE_DOMAIN     localtest.me  resolves to 127.0.0.1 without a hosts entry
#   HTTP_PORT       8080          the port Traefik publishes locally
#
# Note infra declares <prefix>_internal and <prefix>_agent_internal but no infra
# service joins them, so Compose prunes them and `up` does not create them.
# Their scripts/local.sh creates both explicitly; scripts/local.sh --infra here
# checks all three exist before starting anything.
# ---------------------------------------------------------------------------

networks:
  # The shared internal network. infra declares it `internal: true` (no
  # egress), so anything needing outbound internet must also sit on edge —
  # which is how production is arranged.
  default:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge

  agent_internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal

  # Still app-owned; the base file creates it.
  agent_sandbox:
    name: ${NETWORK_PREFIX:-hill90}_agent_sandbox

  # The app's own data plane. App-owned, like agent_sandbox.
  #
  # This exists because service names collide on the shared internal network.
  # Compose always aliases a service by its own name and an overlay cannot
  # remove that alias, so the only way for the app's `postgres` and `keycloak`
  # not to answer to those names alongside Hill90's is to keep them off
  # <prefix>_internal entirely.
  #
  # Observed before this network existed: `nslookup postgres` on
  # <prefix>_internal returned two addresses — Hill90's instance and the app's.
  # Both use role `hill90` with different passwords, so Keycloak reached the
  # wrong one and died with "password authentication failed for user hill90",
  # which reads as a secrets problem and is not one. Being DNS round-robin it
  # would also have succeeded intermittently.
  #
  # `internal: true` matches how Hill90 declares its own internal network: the
  # database needs no egress, and Keycloak reaches the internet over edge.
  app_internal:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_app_internal

services:
  postgres:
    # internal-only, as in production. A container attached solely to an
    # `internal` network cannot publish ports, so PORT_POSTGRES has no effect
    # in this mode — reach the database with `docker exec` instead.
    #
    # app_internal rather than default: Hill90's own postgres already answers to
    # `postgres` on <prefix>_internal. See the app_internal note above.
    networks: [app_internal]

  minio:
    networks: [default, edge]
    labels:
      - "traefik.enable=true"
      # Traefik reaches this container over edge. The provider-wide default is
      # in Traefik's static config, which v2 cannot interpolate, so it cannot
      # follow NETWORK_PREFIX; this label can, and takes precedence. Defaults to
      # hill90_edge, which is what production's own config pins, so production
      # resolves identically. Same pattern as Hill90's
      # deploy/compose/overrides/local.observability.yml.
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"
      - "traefik.http.routers.minio-console.rule=Host(`${STORAGE_HOST:-storage}.${BASE_DOMAIN:-localtest.me}`)"
      - "traefik.http.routers.minio-console.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.routers.minio-console.service=minio-console"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"

  keycloak:
    # Not on default: Hill90's own keycloak already answers to `keycloak` on
    # <prefix>_internal *and* on <prefix>_edge.
    #
    # Keeping it off the shared internal network is not enough. Traefik lives on
    # edge, so the app's keycloak must be on edge to be routed at all — and
    # Hill90's keycloak is aliased `keycloak` there too. Measured from
    # hill90-api: `keycloak` resolved to 172.18.0.6, which is hill90dev-keycloak
    # on <prefix>_edge, so every app service asking for `keycloak:8080` reached
    # the wrong Keycloak and got a 404 for realm `hill90`.
    #
    # Compose cannot remove the service-name alias, so instead the app's
    # keycloak gets an alias that only exists on app_internal, and every
    # app-internal URL below uses that name. Traefik is unaffected because it
    # routes by container IP, not by DNS.
    #
    # THE 18/30 COLLISION THIS USED TO DESCRIBE NO LONGER HAPPENS, and the reason
    # is that nothing drives this file any more. Re-measured 2026-08-01, issue #98.
    #
    # It said `keycloak` stayed ambiguous on edge and that running this overlay
    # degraded Hill90's DNS while it was up. Both were true when written. Neither
    # is reachable now:
    #
    #   - the TENANT path (the default) runs the production compose files plus
    #     deploy/compose/overrides, and since #96 its stack list carries no `auth`,
    #     so no app Keycloak starts at all
    #   - --standalone runs compose/local.yml, whose keycloak sits on a
    #     project-scoped `default` network and never joins Hill90's edge
    #   - THIS FILE is referenced by no code path. scripts/local.sh mentions it
    #     once, in a comment, to say it is not what the tenant path uses
    #
    # Measured on the running tenant path: 120 of 120 lookups of `keycloak` from
    # four app containers resolved to 172.18.0.6, hill90dev-keycloak — 0 wrong,
    # against 18 of 30 wrong before. Exactly one container answers to `keycloak`
    # on edge, and no alias on that network is duplicated at all.
    #
    # The alias below is kept because it is still correct for this file's own
    # shape: if anyone revives this overlay by hand, the app's keycloak must not
    # answer to the bare name on a network Hill90 shares. Reviving it WOULD
    # reintroduce the collision, which is why this comment records the mechanism
    # rather than deleting the history.
    networks:
      app_internal:
        aliases: [app-keycloak]
      edge:
    environment:
      # Traefik terminates the connection, so Keycloak has to be told the
      # browser-facing origin or it stamps the wrong `iss` and builds redirects
      # against the container hostname.
      KC_HOSTNAME: http://${APP_AUTH_HOST:-app-auth}.${BASE_DOMAIN:-localtest.me}:${HTTP_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"
      - "traefik.http.routers.app-keycloak.rule=Host(`${APP_AUTH_HOST:-app-auth}.${BASE_DOMAIN:-localtest.me}`)"
      - "traefik.http.routers.app-keycloak.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.services.app-keycloak.loadbalancer.server.port=8080"

  litellm:
    networks: [default, edge, app_internal]

  api:
    networks: [default, edge, agent_internal, agent_sandbox, app_internal]
    environment:
      KEYCLOAK_ISSUER: http://${APP_AUTH_HOST:-app-auth}.${BASE_DOMAIN:-localtest.me}:${HTTP_PORT:-8080}/realms/hill90
      KEYCLOAK_JWKS_URI: http://app-keycloak:8080/realms/hill90/protocol/openid-connect/certs
      # services/api attaches agent containers to <prefix>_agent_{internal,sandbox}
      # by name. Under this overlay the prefix is infra's, not the default.
      AGENT_NETWORK_PREFIX: ${NETWORK_PREFIX:-hill90}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"
      - "traefik.http.routers.api.rule=Host(`${API_HOST:-api}.${BASE_DOMAIN:-localtest.me}`)"
      - "traefik.http.routers.api.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.services.api.loadbalancer.server.port=3000"

  ai:
    networks: [default, edge, agent_internal, agent_sandbox, app_internal]
    labels:
      # Internal-only in production (traefik.enable=false). Kept that way.
      - "traefik.enable=false"

  knowledge:
    networks: [default, edge, agent_internal, agent_sandbox, app_internal]
    labels:
      - "traefik.enable=false"

  mcp:
    networks: [default, edge, app_internal]
    environment:
      # Base file uses the ambiguous `keycloak`; see the keycloak note above.
      KEYCLOAK_JWKS_URI: http://app-keycloak:8080/realms/hill90/protocol/openid-connect/certs
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"
      # Production routes the MCP gateway on ai.<domain>/mcp, not its own host.
      - "traefik.http.routers.mcp.rule=Host(`${AI_HOST:-ai}.${BASE_DOMAIN:-localtest.me}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.mcp.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.services.mcp.loadbalancer.server.port=8001"
      # The service serves /health and /me at the root, so the /mcp prefix has
      # to come off. Production did this with `mcp-strip@file` from
      # platform/edge/dynamic/middlewares.yml, but Hill90 removed that
      # middleware in JON-27 as app-specific — correctly, since only this
      # service used it. Declared here as a label so the app owns its own
      # routing concern.
      - "traefik.http.middlewares.mcp-strip.stripprefix.prefixes=/mcp"
      - "traefik.http.routers.mcp.middlewares=mcp-strip"

  ui:
    networks: [default, edge, app_internal]
    environment:
      AUTH_KEYCLOAK_ISSUER: http://${APP_AUTH_HOST:-app-auth}.${BASE_DOMAIN:-localtest.me}:${HTTP_PORT:-8080}/realms/hill90
      # Still required: the browser resolves the Traefik hostname, but this
      # container cannot, so the back-channel keeps using the service name.
      KEYCLOAK_INTERNAL_URL: http://app-keycloak:8080
      KEYCLOAK_INTERNAL_ISSUER: http://app-keycloak:8080/realms/hill90
      AUTH_URL: http://${UI_HOST:-app}.${BASE_DOMAIN:-localtest.me}:${HTTP_PORT:-8080}
      API_WS_URL: ws://${API_HOST:-api}.${BASE_DOMAIN:-localtest.me}:${HTTP_PORT:-8080}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"
      - "traefik.http.routers.ui.rule=Host(`${UI_HOST:-app}.${BASE_DOMAIN:-localtest.me}`)"
      - "traefik.http.routers.ui.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.services.ui.loadbalancer.server.port=3000"

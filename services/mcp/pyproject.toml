[tool.poetry]
name = "hill90-mcp"
version = "0.1.0"
description = "Hill90 MCP Gateway"
authors = ["Hill90 Team"]
# Not an installable package -- this is a service, not a library. Matches
# services/knowledge and services/agentbox. Poetry <2 only warned about the
# missing package dir; Poetry 2.x fails the install outright.
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
mcp = "^0.9.0"
pydantic = "^2.5.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
requests = "^2.31.0"
opentelemetry-distro = ">=0.60b1"
opentelemetry-exporter-otlp-proto-http = "^1.39.1"
opentelemetry-instrumentation-fastapi = ">=0.60b1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
black = "^24.1.0"
ruff = "^0.1.0"


[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

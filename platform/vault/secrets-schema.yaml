# Application secrets schema.
#
# Reconstructed during the local-stack work (JON-38). The original lived in the
# Hill90 infrastructure repo, where it had two jobs: describing the app's vault
# layout, and driving infra CI checks. Only the first job belongs here, so this
# is the app half — the infra entries (Traefik, Grafana, OpenBao's own keys) are
# not reproduced. Hill90 keeps its own copy for the CI role.
#
# It is read at request time by services/api/src/routes/secrets.ts to render
# /admin/secrets, and asserted against by src/__tests__/routes-secrets.test.ts.
#
# Paths follow the AppRole policies preserved in platform/vault/policies/.
# `compose_refs` are derived from which deploy/compose/prod/docker-compose.*.yml
# actually references each variable — that is what determines the "consumers"
# column in the admin UI.
#
# There is no OpenBao in the local stack; scripts/local.sh generates these
# values into .env.local instead. This file describes the intended layout.

vault_approle_services:
  - api
  - ai
  - ui
  - mcp
  - knowledge

runtime_secrets:
  # --- shared: database ---------------------------------------------------
  - key: DB_USER
    vault_path: secret/shared/database
    compose_refs:
      - docker-compose.db.yml
      - docker-compose.auth.yml
      - docker-compose.api.yml
      - docker-compose.ai.yml
      - docker-compose.knowledge.yml
  - key: DB_PASSWORD
    vault_path: secret/shared/database
    compose_refs:
      - docker-compose.db.yml
      - docker-compose.auth.yml
      - docker-compose.api.yml
      - docker-compose.ai.yml
      - docker-compose.knowledge.yml

  # --- shared: model router ------------------------------------------------
  # The AI service reads the internal token to verify revocation requests the
  # API sends it; the API holds the Ed25519 private key that signs delegations.
  - key: MODEL_ROUTER_INTERNAL_SERVICE_TOKEN
    vault_path: secret/shared/model-router
    compose_refs:
      - docker-compose.api.yml
      - docker-compose.ai.yml
      - docker-compose.knowledge.yml
  - key: MODEL_ROUTER_SIGNING_PRIVATE_KEY
    vault_path: secret/shared/model-router
    compose_refs:
      - docker-compose.api.yml

  # --- api -----------------------------------------------------------------
  - key: PROVIDER_KEY_ENCRYPTION_KEY
    vault_path: secret/api/config
    compose_refs:
      - docker-compose.api.yml
      - docker-compose.ai.yml
  - key: CHAT_CALLBACK_TOKEN
    vault_path: secret/api/config
    compose_refs:
      - docker-compose.api.yml
  - key: TAVILY_API_KEY
    vault_path: secret/api/config
    compose_refs:
      - docker-compose.api.yml

  # --- ai ------------------------------------------------------------------
  - key: ANTHROPIC_API_KEY
    vault_path: secret/ai/config
    compose_refs:
      - docker-compose.ai.yml
      - docker-compose.api.yml
  - key: OPENAI_API_KEY
    vault_path: secret/ai/config
    compose_refs:
      - docker-compose.ai.yml
  - key: LITELLM_MASTER_KEY
    vault_path: secret/ai/config
    compose_refs:
      - docker-compose.ai.yml
      - docker-compose.knowledge.yml

  # --- knowledge (AKM) ------------------------------------------------------
  - key: AKM_INTERNAL_SERVICE_TOKEN
    vault_path: secret/knowledge/config
    compose_refs:
      - docker-compose.api.yml
      - docker-compose.knowledge.yml
  - key: AKM_SIGNING_PRIVATE_KEY
    vault_path: secret/knowledge/config
    compose_refs:
      - docker-compose.api.yml

  # --- ui ------------------------------------------------------------------
  - key: AUTH_SECRET
    vault_path: secret/ui/config
    compose_refs:
      - docker-compose.ui.yml
  - key: AUTH_KEYCLOAK_ID
    vault_path: secret/ui/config
    compose_refs:
      - docker-compose.ui.yml
  - key: AUTH_KEYCLOAK_SECRET
    vault_path: secret/ui/config
    compose_refs:
      - docker-compose.ui.yml

  # --- auth (Keycloak) ------------------------------------------------------
  - key: KC_ADMIN_USERNAME
    vault_path: secret/auth/config
    compose_refs:
      - docker-compose.auth.yml
  - key: KC_ADMIN_PASSWORD
    vault_path: secret/auth/config
    compose_refs:
      - docker-compose.auth.yml

  # --- object storage -------------------------------------------------------
  - key: MINIO_ROOT_USER
    vault_path: secret/minio/config
    compose_refs:
      - docker-compose.minio.yml
      - docker-compose.api.yml
  - key: MINIO_ROOT_PASSWORD
    vault_path: secret/minio/config
    compose_refs:
      - docker-compose.minio.yml
      - docker-compose.api.yml

  # --- discord bot ----------------------------------------------------------
  # No AppRole: the bot was never wired into the deploy dispatcher.
  - key: DISCORD_BOT_TOKEN
    vault_path: secret/discord/config
    compose_refs:
      - docker-compose.discord-bot.yml
  - key: DISCORD_BOT_SERVICE_TOKEN
    vault_path: secret/discord/config
    compose_refs:
      - docker-compose.discord-bot.yml

# Referenced by compose but not secret — the image tag.
excluded_vars:
  - VERSION

# Local override for deploy/compose/prod/docker-compose.minio.yml
#
#   docker compose -f deploy/compose/prod/docker-compose.minio.yml \
#                  -f deploy/compose/overrides/local.minio.yml \
#                  --env-file .env.local up -d
#
# Layers ON the production file rather than forking it, which is the whole point:
# a fork is how compose/local.yml drifted into something that proved nothing
# about the path production uses. Every fix here lands in a file production also
# reads.
#
# What local always has to change: the `websecure` entrypoint and the Let's
# Encrypt resolver, neither of which exists locally.

services:
  app-minio:
    ports:
      - "${PORT_MINIO:-19000}:9000"
      - "${PORT_MINIO_CONSOLE:-19001}:9001"
    labels:
      - "traefik.http.routers.app-minio-console.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.routers.app-minio-console.tls=false"
      # Production puts this behind tailscale-only@file, an IP allowlist. That
      # middleware DOES exist locally in Hill90's dynamic config, and it would
      # deny local traffic, so swap it rather than leave it referenced.
      - "traefik.http.routers.app-minio-console.middlewares=compress@file"
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"

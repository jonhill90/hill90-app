# Local override for deploy/compose/prod/docker-compose.knowledge.yml
#
#   docker compose -f deploy/compose/prod/docker-compose.knowledge.yml \
#                  -f deploy/compose/overrides/local.knowledge.yml \
#                  --env-file .env.local up -d
#
# Layers ON the production file rather than forking it, which is the whole point:
# a fork is how compose/local.yml drifted into something that proved nothing
# about the path production uses. Every fix here lands in a file production also
# reads.
#
# What local always has to change: the `websecure` entrypoint and the Let's
# Encrypt resolver, neither of which exists locally.

services:
  knowledge:
    # Internal-only in production. Port published so /health is reachable.
    ports:
      - "${PORT_KNOWLEDGE:-18002}:8002"
    volumes:
      # Production expects the `akm-keys` volume to be pre-populated by a deploy
      # step that stayed in Hill90, so locally the service died on startup with
      # FileNotFoundError: /etc/akm/public.pem. Bind-mount the keys local.sh
      # generates instead.
      # Same target path as production's `akm-keys` volume, so this replaces it
      # rather than mounting inside it -- mounting a single file into /etc/akm
      # fails with "make mountpoint: read-only file system", because the
      # directory does not exist in the image and the volume has not been
      # populated yet.
      - ../../../compose/local/keys:/etc/akm:ro

# Local override for deploy/compose/prod/docker-compose.mcp.yml
#
#   docker compose -f deploy/compose/prod/docker-compose.mcp.yml \
#                  -f deploy/compose/overrides/local.mcp.yml \
#                  --env-file .env.local up -d
#
# Layers ON the production file rather than forking it, which is the whole point:
# a fork is how compose/local.yml drifted into something that proved nothing
# about the path production uses. Every fix here lands in a file production also
# reads.
#
# What local always has to change: the `websecure` entrypoint and the Let's
# Encrypt resolver, neither of which exists locally.

services:
  mcp:
    ports:
      - "${PORT_MCP:-18001}:8001"
    environment:
      # Locally Traefik terminates plain http on ${HTTP_PORT}, so the issuer must
      # be http and carry the port. Without this, mcp inherits the production
      # form (https, no port) and the value no longer matches the `iss` Keycloak
      # actually stamps, so every token it validates is rejected. api and ui
      # already override this; mcp was the one that did not.
      KEYCLOAK_ISSUER: http://${APP_AUTH_HOST:-app-auth}.${BASE_DOMAIN:-localtest.me}:${HTTP_PORT:-8080}/realms/${KC_REALM:-hill90}
    labels:
      - "traefik.http.routers.app-mcp.entrypoints=${APP_ENTRYPOINT:-web}"
      - "traefik.http.routers.app-mcp.tls=false"
      # Production uses mcp-strip@file from platform/edge/dynamic/middlewares.yml,
      # which Hill90 removed as app-specific -- correctly, since only this service
      # used it. It is the one @file middleware production references that does
      # NOT exist locally, so it is declared here as a label instead.
      - "traefik.http.middlewares.app-mcp-strip.stripprefix.prefixes=/mcp"
      - "traefik.http.routers.app-mcp.middlewares=app-mcp-strip"
      - "traefik.docker.network=${NETWORK_PREFIX:-hill90}_edge"

version: '3.9'

# Agent Knowledge Manager (AKM) service
# Deploy with: make deploy-knowledge

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal
  agent_internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal
  agent_sandbox:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_sandbox

volumes:
  akm-data:
    name: ${VOLUME_PREFIX:-prod}_app-akm-data
  akm-keys:
    name: ${VOLUME_PREFIX:-prod}_app-akm-keys

services:
  knowledge:
    build:
      context: ../../../services/knowledge
      dockerfile: Dockerfile
      args:
        # Stamps com.hill90.revision onto the IMAGE (see the Dockerfile's own
        # ARG GIT_REVISION). Without this the ARG's default applied and the
        # image was built and labelled the literal string "unstamped" on
        # every deploy — app#558. The CONTAINER label below, set separately
        # via compose `labels:`, was correct the whole time, which is why
        # nobody noticed: check_deploy_drift.sh reads the container's label,
        # not the image's.
        GIT_REVISION: ${DEPLOY_REVISION:-unstamped}
    image: hill90/knowledge:${VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-}app-knowledge
    restart: unless-stopped
    networks:
      - edge
      - internal
      - agent_internal
      - agent_sandbox
    volumes:
      - akm-data:/data/knowledge
      - akm-keys:/etc/akm:ro
    environment:
      - AKM_PORT=8002
      - AKM_DATABASE_URL=postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@${PLATFORM_DB_HOST}:5432/hill90_akm
      - AKM_PUBLIC_KEY_PATH=/etc/akm/public.pem
      - AKM_DATA_DIR=/data/knowledge
      - AKM_CONTEXT_TOKEN_BUDGET=2000
      - AKM_INTERNAL_SERVICE_TOKEN=${AKM_INTERNAL_SERVICE_TOKEN}
      - AI_SERVICE_URL=http://ai:8000
      - MODEL_ROUTER_INTERNAL_SERVICE_TOKEN=${MODEL_ROUTER_INTERNAL_SERVICE_TOKEN}
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - EMBEDDING_MODEL=text-embedding-3-small
      - OTEL_SERVICE_NAME=knowledge
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8002/health'); sys.exit(0 if r.status < 400 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      # Which commit this container was created from. Nothing else on the
      # host can answer that — see #158. Set by scripts/deploy.sh.
      - "com.hill90.revision=${DEPLOY_REVISION:-unstamped}"
      - "traefik.enable=false"
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200

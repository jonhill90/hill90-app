version: '3.9'

# UI service
# Deploy with: make deploy-ui

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

services:
  # UI (Next.js)
  ui:
    build:
      context: ../../../services/ui
      dockerfile: Dockerfile
    image: hill90/ui:${VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-}app-ui
    restart: unless-stopped
    networks:
      - edge
      - internal
    environment:
      - NODE_ENV=production
      - API_URL=http://api:3000
      - AI_URL=http://ai:8000
      - KEYCLOAK_INTERNAL_URL=http://app-keycloak:8080
      # Read by src/app/api/services/health/route.ts to build the realm path it
      # probes. Same knob and same default as the issuer line below, so the two
      # cannot drift apart the way a second hardcoded copy would.
      - KC_REALM=${KC_REALM:-hill90}
      - MCP_URL=http://mcp:8001
      - AUTH_KEYCLOAK_ID=${AUTH_KEYCLOAK_ID}
      - AUTH_KEYCLOAK_SECRET=${AUTH_KEYCLOAK_SECRET}
      # This file contradicted itself: KEYCLOAK_INTERNAL_URL above already
      # pointed at the app's app-keycloak while this pointed at Hill90's, so
      # the back-channel and front-channel disagreed about which Keycloak the
      # app uses. Auth.js validates `iss` against this value.
      - AUTH_KEYCLOAK_ISSUER=https://${APP_AUTH_HOST:-app-auth}.${BASE_DOMAIN:-hill90.com}/realms/${KC_REALM:-hill90}
      - AUTH_SECRET=${AUTH_SECRET}
      # Composed from BASE_DOMAIN, like the issuer, so one knob moves both. It was
      # hardcoded, which meant a domain change silently left this pointing at the old
      # host while everything else followed.
      - AUTH_URL=https://${BASE_DOMAIN:-hill90.com}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-ui.rule=Host(`${BASE_DOMAIN:-hill90.com}`) || Host(`www.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.app-ui.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-ui.tls.certresolver=${PUBLIC_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.app-ui.loadbalancer.server.port=3000"
      - "traefik.http.routers.app-ui.middlewares=rate-limit@file"

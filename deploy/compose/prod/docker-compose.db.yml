version: '3.9'

# PostgreSQL database (shared infrastructure)
# Deploy with: make deploy-db

networks:
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

volumes:
  postgres-data:
    name: prod_postgres-data

services:
  app-postgres:
    image: pgvector/pgvector:pg16
    container_name: ${CONTAINER_PREFIX:-}app-postgres
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../platform/data/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hill90
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: ${CONTAINER_PREFIX:-}app-postgres-exporter
    restart: unless-stopped
    mem_limit: 64m
    networks:
      - internal
    environment:
      # app-postgres, not postgres: the bare name is Hill90's instance on the
      # shared internal network, so this exporter would have scraped the wrong
      # database. Hill90's own postgres-exporter covers Hill90's; this one exists
      # to cover the app's, and Hill90's Prometheus scrapes it.
      - DATA_SOURCE_URI=app-postgres:5432/hill90?sslmode=disable
      - DATA_SOURCE_USER=${DB_USER}
      - DATA_SOURCE_PASS=${DB_PASSWORD}
    depends_on:
      app-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgres_exporter", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3

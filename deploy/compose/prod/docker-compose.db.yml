version: '3.9'

# PostgreSQL database — the APP's own instance, not Hill90's.
#
# Hill90's platform Postgres asserts platform-only databases in its own health
# check and its single role is `hill90` with a different password, so the app
# cannot use it. See docs/decisions/running-the-app-on-hill90-infra.md.
#
# There is deliberately NO postgres-exporter here. Hill90 owns observability and
# already runs one. Note the consequence, which is real: Hill90's exporter is
# single-target (DATA_SOURCE_URI=postgres:5432/hill90), so it covers Hill90's
# database and NOT this one. Until Hill90 adds multi-target scraping — which
# postgres-exporter v0.17.1 supports via /probe?target= — the app's database has
# no metrics. Tracked in the tenant deployment runbook, Phase A step 1.

networks:
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

volumes:
  postgres-data:
    name: prod_postgres-data

services:
  app-postgres:
    image: pgvector/pgvector:pg16
    container_name: ${CONTAINER_PREFIX:-}app-postgres
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../platform/data/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hill90
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

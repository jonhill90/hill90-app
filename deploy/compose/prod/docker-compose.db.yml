# RETIRED IN PRODUCTION — 2026-07-31.
#
# app-postgres was stopped and removed from the VPS. All four services read Hill90's
# platform Postgres as the tenant role `hill90_app`: app-api and app-ai use
# hill90_api, app-litellm hill90_litellm, app-knowledge hill90_akm.
#
# THE VOLUME WAS KEPT. prod_app-postgres-data still exists, untouched, holding 103MB
# including the `keycloak` database and realm hill90. All five databases were also
# dumped to /opt/hill90/backups/app-postgres-final/ and the dump was PROVEN to
# restore. See docs/decisions/retiring-app-postgres.md.
#
# This file is deliberately NOT deleted. deploy/compose/overrides/local.db.yml layers
# on it and LOCAL development still runs the app's own Postgres — deleting it would
# break local while gaining nothing in production, where scripts/deploy.sh now refuses
# the `db` stack and has dropped it from DEPLOY_REST.
#
version: '3.9'

# PostgreSQL database — the APP's own instance, not Hill90's. Local only; see above.
#
# The original reason this existed no longer holds, and the correction matters because
# it was the whole justification for a second Postgres: Hill90's platform Postgres
# was described as unusable by the app because it asserts platform-only databases in
# its health check and has a single role `hill90`. In fact the platform grew a tenant
# role, `hill90_app` (NOSUPERUSER), with per-database grants, and the app has run on
# it in production since the cutover. See docs/decisions/retiring-app-postgres.md and
# docs/decisions/database-credentials-and-inspectability.md.
#
# There is deliberately NO postgres-exporter here. Hill90 owns observability and
# already runs one. The metrics gap this used to note is PARTLY closed by the cutover,
# and the remaining half is worth stating precisely. Hill90's exporter connects to
# postgres:5432/hill90 (verified 2026-07-31). Cluster-wide views are visible from any
# database, so pg_stat_database for hill90_api, hill90_akm and hill90_litellm IS now
# scraped. Per-table views are not — pg_stat_user_tables is per-database, so table and
# index statistics for the app's databases remain unscraped until Hill90 adds
# multi-target scraping, which postgres-exporter v0.17.1 supports via /probe?target=.

networks:
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

volumes:
  postgres-data:
    name: ${VOLUME_PREFIX:-prod}_app-postgres-data

services:
  app-postgres:
    image: pgvector/pgvector:pg16
    container_name: ${CONTAINER_PREFIX:-}app-postgres
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../../platform/data/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=hill90
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

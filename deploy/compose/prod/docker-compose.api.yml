version: '3.9'

# API Gateway service
# Deploy with: make deploy-api

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal
  agent_internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal
  agent_sandbox:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_agent_sandbox
  docker_proxy:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_docker_proxy

services:
  # Docker Socket Proxy — limits API surface for agentbox container management
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: ${CONTAINER_PREFIX:-}app-docker-proxy
    restart: unless-stopped
    networks:
      - docker_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow container lifecycle operations (create, start, stop, remove, inspect, logs)
      - CONTAINERS=1
      # Allow volume operations (create, remove for agentbox workspace/logs/data volumes)
      - VOLUMES=1
      # POST required for container create/start/stop/remove and exec create/start
      - POST=1
      # Allow exec into agentbox containers (used by events endpoint for tail -f)
      - EXEC=1
      # Deny everything else
      - EVENTS=0
      - IMAGES=0
      - NETWORKS=1
      - VERSION=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - GRPC=0
      - PLUGINS=0
      - SECRETS=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # API Gateway (TypeScript/Express)
  api:
    build:
      context: ../../../services/api
      dockerfile: Dockerfile
    image: hill90/api:${VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-}app-api
    restart: unless-stopped
    networks:
      - edge
      - internal
      - agent_internal
      - agent_sandbox
      - docker_proxy
    depends_on:
      docker-proxy:
        condition: service_healthy
    volumes:
      - ${AGENTBOX_CONFIG_HOST_PATH:-/opt/hill90/agentbox-configs}:/data/agentbox
      - ../../../platform/vault/secrets-schema.yaml:/data/secrets-schema.yaml:ro
    environment:
      - NODE_ENV=production
      - SECRETS_SCHEMA_PATH=/data/secrets-schema.yaml
      - PORT=3000
      - AI_SERVICE_URL=http://ai:8000
      # Front-channel: must match the `iss` claim Keycloak stamps, so it is
      # the browser-facing host. auth.<domain> is HILL90's Keycloak, serving
      # realm `platform`; the app's is app-auth serving realm `hill90`.
      - KEYCLOAK_ISSUER=https://${KC_HOST:-auth}.${BASE_DOMAIN:-hill90.com}/realms/${KC_REALM:-platform}
      # Back-channel: resolved inside the network, so it uses the app's own
      # service name rather than going out through Traefik and back.
      # KEYCLOAK_JWKS_URI is deliberately NOT set.
      #
      # It was hardcoded to http://app-keycloak:8080/... — which meant flipping
      # APP_AUTH_HOST moved only the FRONT channel. The back channel kept asking
      # app-keycloak for a realm the new Keycloak would host, so every API and MCP
      # call would 401 while the login page looked fine. Worse, reverting
      # APP_AUTH_HOST alone would restore the login page and leave authenticated
      # calls broken — a revert that looks like it worked.
      #
      # Unset, both services derive it from KEYCLOAK_ISSUER
      # (services/api/src/index.ts, services/mcp/app/main.py), so APP_AUTH_HOST is
      # the single knob and front and back channels cannot diverge.
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@app-postgres:5432/hill90_api
      - DOCKER_HOST=tcp://docker-proxy:2375
      # services/api attaches agent containers to <prefix>_agent_internal and
      # <prefix>_agent_sandbox BY NAME (services/api/src/services/docker.ts:29,
      # which defaults to 'hill90'). The compose side was parameterised and the
      # container side was not, so the two agreed only while NETWORK_PREFIX was
      # unset. That is true on the VPS today and stops being true the moment a
      # second environment exists — at which point agents attach to another
      # environment's networks, or to none.
      - AGENT_NETWORK_PREFIX=${NETWORK_PREFIX:-hill90}
      - AGENTBOX_CONFIG_HOST_PATH=${AGENTBOX_CONFIG_HOST_PATH:-/opt/hill90/agentbox-configs}
      - ENVIRONMENT=production
      - OTEL_SERVICE_NAME=api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - MINIO_ENDPOINT=http://app-minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - AKM_SIGNING_PRIVATE_KEY=${AKM_SIGNING_PRIVATE_KEY}
      - AKM_INTERNAL_SERVICE_TOKEN=${AKM_INTERNAL_SERVICE_TOKEN}
      - AKM_SERVICE_URL=http://knowledge:8002
      - MODEL_ROUTER_SIGNING_PRIVATE_KEY=${MODEL_ROUTER_SIGNING_PRIVATE_KEY}
      - MODEL_ROUTER_INTERNAL_SERVICE_TOKEN=${MODEL_ROUTER_INTERNAL_SERVICE_TOKEN}
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY}
      - MODEL_ROUTER_URL=http://ai:8000
      - CHAT_CALLBACK_TOKEN=${CHAT_CALLBACK_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-api.rule=Host(`${API_HOST:-api}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.app-api.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-api.tls.certresolver=${PUBLIC_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.app-api.loadbalancer.server.port=3000"

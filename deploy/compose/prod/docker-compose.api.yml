version: '3.9'

# API Gateway service
# Deploy with: make deploy-api

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal
  agent_internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal
  agent_sandbox:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_agent_sandbox
  docker_proxy:
    driver: bridge
    internal: true
    name: ${NETWORK_PREFIX:-hill90}_docker_proxy

services:
  # Docker Socket Proxy — limits API surface for agentbox container management
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3
    container_name: ${CONTAINER_PREFIX:-}app-docker-proxy
    restart: unless-stopped
    networks:
      - docker_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Allow container lifecycle operations (create, start, stop, remove, inspect, logs)
      - CONTAINERS=1
      # Allow volume operations (create, remove for agentbox workspace/logs/data volumes)
      - VOLUMES=1
      # POST required for container create/start/stop/remove and exec create/start
      - POST=1
      # Allow exec into agentbox containers (used by events endpoint for tail -f)
      - EXEC=1
      # Deny everything else
      - EVENTS=0
      - IMAGES=0
      - NETWORKS=1
      - VERSION=0
      - SERVICES=0
      - TASKS=0
      - NODES=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - GRPC=0
      - PLUGINS=0
      - SECRETS=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # API Gateway (TypeScript/Express)
  api:
    build:
      context: ../../../services/api
      dockerfile: Dockerfile
      args:
        # Stamps com.hill90.revision onto the IMAGE (see the Dockerfile's own
        # ARG GIT_REVISION, added by app#561 — the twin fix for the four
        # services #558/#560 found with no ARG at all to receive this).
        # Without this the ARG's default applies and the image is built and
        # labelled the literal string "unstamped" on every deploy. The
        # CONTAINER label below, set separately via compose `labels:`, is
        # correct regardless — check_deploy_drift.sh reads the container's
        # label, not the image's.
        GIT_REVISION: ${DEPLOY_REVISION:-unstamped}
    image: hill90/api:${VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-}app-api
    # --max-old-space-size, because a mem_limit ALONE makes this worse under a
    # leak, not better. V8 sizes its heap from HOST memory and ignores the
    # cgroup: both node containers were measured reporting a 2096 MiB heap
    # ceiling on a 7.75 GiB machine. Without this flag the process happily
    # grows past 512m and the kernel kills the container, instead of V8
    # collecting harder as it approaches its own limit.
    #
    # Set via `command` rather than NODE_OPTIONS on purpose: the Dockerfile
    # already sets NODE_OPTIONS="--require ./dist/tracing.js", and an
    # environment entry here would REPLACE it and silently disable tracing.
    #
    # 320 is 62% of the container limit. Buffers live OUTSIDE the V8 heap, so
    # the remaining ~190 MiB is what the upload buffers above draw on; this
    # flag bounds JS-object growth, mem_limit bounds the rest.
    command: ["node", "--max-old-space-size=320", "dist/index.js"]
    restart: unless-stopped
    networks:
      - edge
      - internal
      - agent_internal
      - agent_sandbox
      - docker_proxy
    depends_on:
      docker-proxy:
        condition: service_healthy
    volumes:
      - ${AGENTBOX_CONFIG_HOST_PATH:-/opt/hill90/agentbox-configs}:/data/agentbox
      - ../../../platform/vault/secrets-schema.yaml:/data/secrets-schema.yaml:ro
    environment:
      - NODE_ENV=production
      # The commit this container was built from, as an ENV so the process can
      # report it — the label above answers the same question but only to
      # someone on the host with docker. Exposed on /health/detailed, which
      # requires a session; NOT on /health, which is public and where a build
      # SHA would re-open exactly what #136 closed.
      - DEPLOY_REVISION=${DEPLOY_REVISION:-unstamped}
      - SECRETS_SCHEMA_PATH=/data/secrets-schema.yaml
      - PORT=3000
      - AI_SERVICE_URL=http://ai:8000
      # Front-channel: must match the `iss` claim Keycloak stamps, so it is
      # the browser-facing host. auth.<domain> is HILL90's Keycloak, serving
      # realm `platform`; the app's is app-auth serving realm `hill90`.
      - KEYCLOAK_ISSUER=https://${KC_HOST:-auth}.${BASE_DOMAIN:-hill90.com}/realms/${KC_REALM:-platform}
      # Origin allowlist for the terminal WebSocket upgrade. Composed from BASE_DOMAIN
      # like the issuer above and like app-ui's Traefik rule, so one knob moves all of
      # them and the list cannot drift from where the UI is actually served.
      #
      # This is a SECURITY CONTROL and it fails closed: unset or empty refuses every
      # terminal. WebSockets are not covered by the same-origin policy, so without this
      # any page a signed-in user visits can open a terminal into their agent container.
      # Must match app-ui's router: the apex and www.
      - TERMINAL_ALLOWED_ORIGINS=https://${BASE_DOMAIN:-hill90.com},https://www.${BASE_DOMAIN:-hill90.com}
      # Back-channel: resolved inside the network, so it uses the app's own
      # service name rather than going out through Traefik and back.
      # KEYCLOAK_JWKS_URI is deliberately NOT set.
      #
      # It was hardcoded to http://app-keycloak:8080/... — which meant flipping
      # APP_AUTH_HOST moved only the FRONT channel. The back channel kept asking
      # app-keycloak for a realm the new Keycloak would host, so every API and MCP
      # call would 401 while the login page looked fine. Worse, reverting
      # APP_AUTH_HOST alone would restore the login page and leave authenticated
      # calls broken — a revert that looks like it worked.
      #
      # Unset, both services derive it from KEYCLOAK_ISSUER
      # (services/api/src/index.ts, services/mcp/app/main.py), so APP_AUTH_HOST is
      # the single knob and front and back channels cannot diverge.
      #
      # app#500: the hill90-realm-admin service account for /admin/users.
      # KEYCLOAK_ADMIN_URL is deliberately NOT set either, for the identical
      # reason KEYCLOAK_JWKS_URI above is not — this app is a tenant with no
      # internal shortcut to Hill90's Keycloak, so KEYCLOAK_ISSUER's own
      # externally-reachable host is the correct address for admin API calls
      # too. These two are unset in the SOPS store as of this PR — the
      # hill90-realm-admin client does not exist on the live Keycloak yet, and
      # creating one is a deliberate decision for Jon to make, not something
      # this PR does. Until both are filled in, GET /admin/users returns 503.
      - KEYCLOAK_REALM_ADMIN_CLIENT_ID=${KEYCLOAK_REALM_ADMIN_CLIENT_ID:-}
      - KEYCLOAK_REALM_ADMIN_CLIENT_SECRET=${KEYCLOAK_REALM_ADMIN_CLIENT_SECRET:-}
      # The PLATFORM Postgres, via the tenant login the platform provisions.
      # DB_USER/DB_PASSWORD are app-postgres's superuser and are still deliberately
      # NOT reused here. Their consumers are now LOCAL ONLY — app-postgres was
      # retired in production on 2026-07-31 and app-keycloak on 2026-07-30, so in
      # prod nothing reads them, while scripts/local.sh still brings up the app's own
      # Postgres. Keeping the two credentials separate is what makes the tenant role
      # hill90_app a NOSUPERUSER account rather than a superuser by inheritance.
      - DATABASE_URL=postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@${PLATFORM_DB_HOST}:5432/hill90_api
      - DOCKER_HOST=tcp://docker-proxy:2375
      # services/api attaches agent containers to <prefix>_agent_internal and
      # <prefix>_agent_sandbox BY NAME (services/api/src/services/docker.ts:29,
      # which defaults to 'hill90'). The compose side was parameterised and the
      # container side was not, so the two agreed only while NETWORK_PREFIX was
      # unset. That is true on the VPS today and stops being true the moment a
      # second environment exists — at which point agents attach to another
      # environment's networks, or to none.
      - AGENT_NETWORK_PREFIX=${NETWORK_PREFIX:-hill90}
      - AGENTBOX_CONFIG_HOST_PATH=${AGENTBOX_CONFIG_HOST_PATH:-/opt/hill90/agentbox-configs}
      - ENVIRONMENT=production
      - OTEL_SERVICE_NAME=api
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      # Object storage moved UP into the platform on 2026-07-31. The S3 API is
      # internal-only by design, so this is a container-name hop on
      # hill90_internal, not a public endpoint.
      #
      # NOT the root credentials. app-api used to receive ${MINIO_ROOT_USER},
      # i.e. root on its own MinIO; carrying that over would have handed the
      # tenant root on the PLATFORM's object store. These are a scoped
      # credential — MinIO policy `tenant-hill90-app` allows s3 read/write on
      # exactly agent-avatars, chat-attachments and user-avatars, and refuses
      # bucket creation, the admin API and .minio.sys. Same shape as the
      # tenant's Postgres role.
      #
      # Hill90's store is authoritative for both values; these are a replica.
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_TENANT_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_TENANT_SECRET_KEY}
      - AKM_SIGNING_PRIVATE_KEY=${AKM_SIGNING_PRIVATE_KEY}
      - AKM_INTERNAL_SERVICE_TOKEN=${AKM_INTERNAL_SERVICE_TOKEN}
      - AKM_SERVICE_URL=http://knowledge:8002
      - MODEL_ROUTER_SIGNING_PRIVATE_KEY=${MODEL_ROUTER_SIGNING_PRIVATE_KEY}
      - MODEL_ROUTER_INTERNAL_SERVICE_TOKEN=${MODEL_ROUTER_INTERNAL_SERVICE_TOKEN}
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY}
      - MODEL_ROUTER_URL=http://ai:8000
      - CHAT_CALLBACK_TOKEN=${CHAT_CALLBACK_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Memory ceiling. This is a TENANT on a host shared with the platform, and
    # the OOM killer does not respect tenancy boundaries: an unbounded app
    # container can starve the Postgres and Keycloak this app depends on, which
    # would break the very contract that says the platform provides identity
    # and data (#144).
    #
    # 512m is derived, not rounded to taste. Measured on the VPS 2026-08-03:
    # app-api 60.03 MiB against the full 15.61 GiB, because it had no ceiling.
    # The headroom above that is for the largest transient this service can
    # legitimately hold: routes/storage.ts uses multer.memoryStorage() with
    # fileSize 50 MB, so every concurrent upload buffers 50 MiB of RAM.
    # 60 + 2x50 + runtime lands near 200 MiB; 512m is ~2.5x that, and matches
    # what knowledge and ai already carry.
    mem_limit: 512m
    labels:
      # Which commit this container was created from. Nothing else on the
      # host can answer that — see #158. Set by scripts/deploy.sh.
      - "com.hill90.revision=${DEPLOY_REVISION:-unstamped}"
      - "traefik.enable=true"
      - "traefik.http.routers.app-api.rule=Host(`${API_HOST:-api}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.app-api.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-api.tls.certresolver=${PUBLIC_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.app-api.loadbalancer.server.port=3000"

version: '3.9'

# Keycloak identity provider
# Deploy with: make deploy-auth

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

services:
  app-keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    container_name: ${CONTAINER_PREFIX:-}app-keycloak
    restart: unless-stopped
    networks:
      - edge
      - internal
    volumes:
      - ../../../platform/auth/keycloak/hill90-realm.json:/opt/keycloak/data/import/hill90-realm.json:ro
      - ../../../platform/auth/keycloak/themes/hill90:/opt/keycloak/themes/hill90:ro
    tmpfs:
      - /opt/keycloak/data/tmp:size=100m
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://app-postgres:5432/keycloak
      - KC_DB_USERNAME=${DB_USER}
      - KC_DB_PASSWORD=${DB_PASSWORD}
      # PINNED to the literal app-auth, deliberately NOT ${APP_AUTH_HOST}.
      #
      # APP_AUTH_HOST is the knob that repoints the APP's CONSUMERS (api, mcp, ui)
      # at a different Keycloak. It must never move THIS container, which is the
      # thing being migrated away from and the rollback target.
      #
      # If this followed APP_AUTH_HOST, flipping it to "auth" would make
      # app-keycloak stamp `iss` as https://auth.hill90.com while still serving
      # realm hill90 — so the fallback Keycloak would advertise an identity that is
      # not its own, and the rollback would be broken at the moment it was needed.
      - KC_HOSTNAME=${KC_HOSTNAME:-https://app-auth.${BASE_DOMAIN:-hill90.com}}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_HTTP_METRICS_HISTOGRAMS_ENABLED=true
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - JAVA_OPTS_APPEND=-Xms256m -Xmx768m
      - KC_TRACING_ENABLED=true
      - KC_TRACING_ENDPOINT=http://tempo:4317
      - KC_TRACING_PROTOCOL=grpc
      - KC_TELEMETRY_SERVICE_NAME=keycloak
    # Theme caching stays ON here, mirroring Hill90's own docker-compose.auth.yml,
    # whose comment states it directly: the theme SPI settings are Keycloak's
    # documented theme-AUTHORING settings and "production must not have them".
    # Hill90's running keycloak carries neither; this container carried both.
    #
    # Keycloak 26.4's own docs spell them with a DOUBLE hyphen:
    #   kc.sh start --spi-theme--static-max-age=-1 --spi-theme--cache-themes=false
    # This file used a single hyphen, so whether the flags were ever in EFFECT is
    # unproven — they may have been silently inert. Either way they do not belong
    # in production, and the local override now carries the documented spelling.
    command: start --import-realm
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.app-keycloak.loadbalancer.server.port=8080"
      # All Keycloak traffic on app-auth.<domain> (admin protected by KC
      # credentials + MFA). NOT auth.<domain> — that is Hill90's Keycloak and its
      # OpenBao/Grafana/Portainer SSO.
      # PINNED to the literal app-auth. See KC_HOSTNAME above for why.
      #
      # This label is the dangerous one. Traefik labels bake at container creation,
      # so this does not fail when APP_AUTH_HOST is flipped — it fails on some
      # LATER, unrelated `deploy.sh auth`, long after the migration was called
      # verified. At that point this router's rule becomes Host(`auth.hill90.com`):
      # the identical rule, on the identical entrypoint, on the same Traefik, with
      # both Keycloaks on hill90_edge. Traefik then picks between them
      # non-deterministically, and app-keycloak has NO platform realm — so Grafana,
      # Portainer and OpenBao SSO, which all live on
      # auth.hill90.com/realms/platform, break with no change having been deployed
      # to them.
      - "traefik.http.routers.app-keycloak.rule=Host(`app-auth.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.app-keycloak.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-keycloak.tls.certresolver=${PUBLIC_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.routers.app-keycloak.service=app-keycloak"

version: '3.9'

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

volumes:
  minio-data:
    name: ${VOLUME_PREFIX:-prod}_app-minio-data

services:
  app-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: ${CONTAINER_PREFIX:-}app-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    networks:
      - edge
      - internal
    volumes:
      - minio-data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-minio-console.rule=Host(`${STORAGE_HOST:-storage}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.app-minio-console.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-minio-console.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.app-minio-console.middlewares=tailscale-only@file"
      - "traefik.http.services.app-minio-console.loadbalancer.server.port=9001"

version: '3.9'

# AI service (model-router gateway) + LiteLLM proxy
# Deploy with: make deploy-ai

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal
  agent_internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_internal
  agent_sandbox:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_agent_sandbox

volumes:
  akm-keys:
    name: ${VOLUME_PREFIX:-prod}_app-akm-keys

services:
  # LiteLLM — stateless proxy for provider API routing
  # On edge (internet egress for provider APIs) + internal (reachable by AI service)
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-v1.81.12-stable
    container_name: ${CONTAINER_PREFIX:-}app-litellm
    restart: unless-stopped
    networks:
      - edge
      - internal
    volumes:
      - ../../../platform/ai/litellm_config.yaml:/app/config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DATABASE_URL=postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@${PLATFORM_DB_HOST}:5432/hill90_litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:4000/health/liveliness'); sys.exit(0 if r.status < 400 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      # 15s could not survive a FIRST run, and only a first run exposes it.
      #
      # On an empty database litellm applies its whole prisma migration set
      # before it binds the port. Measured from a genuine from-nothing start on
      # 2026-07-31: container up at 05:31:32, first successful probe at 05:34:24
      # — 172 seconds, of which ~37s was `prisma migrate deploy` and the rest
      # engine download plus the post-migration diff.
      #
      # With start_period: 15s the probes at 05:32:18, 05:32:48 and 05:33:20
      # counted as real failures, the container was marked `unhealthy`, and
      # `app-ai`'s `condition: service_healthy` aborted the whole `up`. app-ai
      # never left `Created`. litellm itself recovered on its own a minute
      # later, which is what makes this invisible on any subsequent run — the
      # database is already migrated and it binds in seconds.
      #
      # 300s is the measured 172s plus headroom for a slower machine or a larger
      # migration set. It does NOT weaken liveness detection: failures still
      # count once the period ends, so a genuinely dead litellm is still caught
      # by interval x retries. It only stops Docker calling a service dead while
      # it is doing the one-time work it must do before it can answer.
      start_period: 300s
    mem_limit: 1g
    cpus: 1.0
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-litellm.rule=Host(`${LITELLM_HOST:-litellm}.${BASE_DOMAIN:-hill90.com}`)"
      - "traefik.http.routers.app-litellm.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-litellm.tls.certresolver=${ADMIN_CERT_RESOLVER:-letsencrypt-dns}"
      - "traefik.http.routers.app-litellm.middlewares=tailscale-only@file"
      - "traefik.http.services.app-litellm.loadbalancer.server.port=4000"

  # AI Service (Python/FastAPI) — model-router gateway
  # On internal + agent_internal (reachable from agentboxes as http://ai:8000)
  ai:
    build:
      context: ../../../services/ai
      dockerfile: Dockerfile
    image: hill90/ai:${VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-}app-ai
    restart: unless-stopped
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - edge
      - internal
      - agent_internal
      - agent_sandbox
    volumes:
      - akm-keys:/etc/akm:ro
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - LITELLM_URL=http://litellm:4000
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=postgresql://${PLATFORM_DB_USER}:${PLATFORM_DB_PASSWORD}@${PLATFORM_DB_HOST}:5432/hill90_api
      - PUBLIC_KEY_PATH=/etc/akm/model-router-public.pem
      - MODEL_ROUTER_INTERNAL_SERVICE_TOKEN=${MODEL_ROUTER_INTERNAL_SERVICE_TOKEN}
      - PROVIDER_KEY_ENCRYPTION_KEY=${PROVIDER_KEY_ENCRYPTION_KEY}
      - API_SERVICE_URL=http://api:3000
      - OTEL_SERVICE_NAME=ai
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/health/ready'); sys.exit(0 if r.status < 400 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    labels:
      - "traefik.enable=false"

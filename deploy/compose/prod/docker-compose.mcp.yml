version: '3.9'

# MCP Gateway service
# Deploy with: make deploy-mcp

networks:
  edge:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_edge
  internal:
    external: true
    name: ${NETWORK_PREFIX:-hill90}_internal

services:
  # MCP Gateway (Python/FastAPI)
  mcp:
    build:
      context: ../../../services/mcp
      dockerfile: Dockerfile
      args:
        # Stamps com.hill90.revision onto the IMAGE (see the Dockerfile's own
        # ARG GIT_REVISION, added by app#561 — the twin fix for the four
        # services #558/#560 found with no ARG at all to receive this).
        # Without this the ARG's default applies and the image is built and
        # labelled the literal string "unstamped" on every deploy. The
        # CONTAINER label below, set separately via compose `labels:`, is
        # correct regardless — check_deploy_drift.sh reads the container's
        # label, not the image's.
        GIT_REVISION: ${DEPLOY_REVISION:-unstamped}
    image: hill90/mcp:${VERSION:-latest}
    container_name: ${CONTAINER_PREFIX:-}app-mcp
    restart: unless-stopped
    networks:
      - edge
      - internal
    environment:
      - ENVIRONMENT=production
      - PORT=8001
      # See docker-compose.api.yml: front-channel issuer, back-channel JWKS.
      - KEYCLOAK_ISSUER=https://${KC_HOST:-auth}.${BASE_DOMAIN:-hill90.com}/realms/${KC_REALM:-platform}
      # KEYCLOAK_JWKS_URI is deliberately NOT set.
      #
      # It was hardcoded to http://app-keycloak:8080/... — which meant flipping
      # APP_AUTH_HOST moved only the FRONT channel. The back channel kept asking
      # app-keycloak for a realm the new Keycloak would host, so every API and MCP
      # call would 401 while the login page looked fine. Worse, reverting
      # APP_AUTH_HOST alone would restore the login page and leave authenticated
      # calls broken — a revert that looks like it worked.
      #
      # Unset, both services derive it from KEYCLOAK_ISSUER
      # (services/api/src/index.ts, services/mcp/app/main.py), so APP_AUTH_HOST is
      # the single knob and front and back channels cannot diverge.
      - OTEL_SERVICE_NAME=mcp
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    # See docker-compose.api.yml. Measured on the VPS 2026-08-03: app-mcp
    # 74.3 MiB, no ceiling. 512m matches its FastAPI siblings knowledge and ai,
    # which sit at ~85 MiB against the same 512m.
    #
    # An earlier draft proposed 768m on the strength of a 297.5 MiB cgroup peak
    # seen LOCALLY over two days. The host reading does not support that, so it
    # is not used — but the local peak is recorded here rather than discarded,
    # because it is the only evidence either way that this service spikes well
    # above its resting size. If mcp is ever OOM-killed, that number is the
    # first place to look and 512m is the first thing to question.
    # No --max-old-space-size equivalent: this is Python, not node.
    mem_limit: 512m
    labels:
      # Which commit this container was created from. Nothing else on the
      # host can answer that — see #158. Set by scripts/deploy.sh.
      - "com.hill90.revision=${DEPLOY_REVISION:-unstamped}"
      - "traefik.enable=true"
      - "traefik.http.routers.app-mcp.rule=Host(`${AI_HOST:-ai}.${BASE_DOMAIN:-hill90.com}`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.app-mcp.entrypoints=${PUBLIC_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.app-mcp.tls.certresolver=${PUBLIC_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.app-mcp.loadbalancer.server.port=8001"
      # mcp-strip is declared HERE as a label, not referenced as @file.
      #
      # Hill90 used to define mcp-strip in platform/edge/dynamic/middlewares.yml
      # and removed it in JON-27 as app-specific -- correctly, since only this
      # service used it. A router naming a middleware the provider does not
      # define does not degrade gracefully: Traefik errors the router and it
      # serves nothing, so this would have been a 100% outage of the MCP gateway
      # with no obvious cause.
      #
      # The service serves /health and /me at its root, so the /mcp prefix has to
      # come off. Owning the middleware here is also the correct boundary: it is
      # an app routing concern, which is why Hill90 was right to drop it.
      - "traefik.http.middlewares.app-mcp-strip.stripprefix.prefixes=/mcp"
      - "traefik.http.routers.app-mcp.middlewares=app-mcp-strip"

# SOPS configuration for hill90-app.
#
# This encrypts to the HOST's age key, the same one Hill90 uses. That is
# deliberate and is a coupling worth understanding rather than a copy-paste
# error:
#
#   * The VPS keeps one age key, at /opt/hill90/secrets/keys/keys.txt. The deploy
#     user's .bashrc exports SOPS_AGE_KEY_FILE to it, and the deploy workflow
#     exports it inline in the ssh command as well, because a non-interactive ssh
#     does not reliably source .bashrc.
#   * A separate key for the app was considered and rejected. Both deploys run as
#     the same `deploy` user on the same host, and the key is mode 600 owned by
#     that user, so a second key would add no isolation the OS does not already
#     decline to provide — only a second thing to rotate.
#
# The consequence to be aware of: this repository's SOPS_AGE_KEY GitHub secret
# therefore holds a key that can also decrypt Hill90's store. It never sees
# Hill90's ciphertext, but the capability exists, and that is the price of one
# key per host.
#
# Public half, from Hill90's committed infra/secrets/keys/age-prod.pub.
creation_rules:
  - path_regex: prod\.enc\.env$
    age: >-
      age1p30vk2qpvlkj5pzh72f0wwvlqgmedvr204nldmpskmptgy9ryg8qg9qd5v

  # Test-account credentials. Deliberately a separate file from prod.enc.env:
  # nothing in compose interpolates these, so putting them in the deploy store
  # would trip tests/scripts/store-keys-check.sh — and that check is right, since
  # a store key nothing reads is the defect #22 removed.
  - path_regex: test-accounts\.enc\.env$
    age: >-
      age1p30vk2qpvlkj5pzh72f0wwvlqgmedvr204nldmpskmptgy9ryg8qg9qd5v

  - path_regex: dev\.enc\.env$
    age: >-
      age1qa7guugjcvzpymcqxky7g3m3hwsnyuvapk4wh52lnqlrwfucp9ws0alq9n

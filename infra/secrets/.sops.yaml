# SOPS configuration for hill90-app.
#
# The app has its OWN age key, deliberately not Hill90's. Reusing Hill90's key
# would let the app decrypt platform secrets it has no business reading, and
# would mean rotating one forces rotating the other. Tenancy is a trust boundary
# as well as a naming one.
#
# Replace the placeholder below with the public half of the key you generate:
#
#   age-keygen -o infra/secrets/keys/age-prod.key
#
# age-keygen prints the public key to stderr and writes the private half to the
# file. Only the public key belongs here. infra/secrets/keys/ is gitignored.
creation_rules:
  - path_regex: prod\.enc\.env$
    age: >-
      REPLACE_WITH_APP_AGE_PUBLIC_KEY

  - path_regex: dev\.enc\.env$
    age: >-
      REPLACE_WITH_APP_AGE_PUBLIC_KEY

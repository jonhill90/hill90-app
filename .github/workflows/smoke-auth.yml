name: Smoke Test Auth (Prod)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-auth-success]

jobs:
  smoke:
    name: Auth theme smoke tests
    runs-on: ubuntu-latest
    # No timeout here meant a hang inherited GitHub's 6-hour job default — a
    # dispatched run was observed stuck in the test step for 20+ minutes with
    # nothing to catch it. 10 minutes covers a real pass with room to spare
    # (npm ci is cached; `playwright install --with-deps chromium` is
    # typically 1-2 minutes on a cache miss; the auth project is a single
    # spec file, 9 lightweight assertions against page load/computed-style,
    # normally seconds) while still surfacing a hang within single-digit
    # minutes instead of hours.
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      # Hill90#792 finding 3: continue-on-error here made this job green
      # whatever Playwright found — the file had zero occurrences of
      # `outcome`/`conclusion`, so nothing downstream ever read the real
      # result. The report upload below is already unconditional via its
      # own `if: always()`, independent of this flag — continue-on-error
      # added nothing to that and only suppressed the one thing that
      # mattered: a real production auth regression failing this job.
      #
      # A bare `npx playwright test` runs every project in
      # tests/e2e/playwright.config.ts — smoke, auth, and app, ten spec
      # files — not the auth theme this job's name and its
      # deploy-auth-success trigger both promise. Eight of the app-project
      # specs write to production (upload-and-delete, create workflow,
      # start agent) and are app#514's subject; this job has no credentials
      # for them and was never meant to run them. --project=auth scopes it
      # to auth-theme.spec.ts against auth.hill90.com, matching what it is
      # actually wired to.
      - name: Run smoke tests
        run: npx playwright test --project=auth
        working-directory: tests/e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

name: Smoke Test Auth (Prod)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [deploy-auth-success]

jobs:
  smoke:
    name: Auth theme smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      # Hill90#792 finding 3: continue-on-error here made this job green
      # whatever Playwright found — the file had zero occurrences of
      # `outcome`/`conclusion`, so nothing downstream ever read the real
      # result. The report upload below is already unconditional via its
      # own `if: always()`, independent of this flag — continue-on-error
      # added nothing to that and only suppressed the one thing that
      # mattered: a real production auth regression failing this job.
      - name: Run smoke tests
        run: npx playwright test
        working-directory: tests/e2e

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

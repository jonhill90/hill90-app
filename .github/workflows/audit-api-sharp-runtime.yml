name: Audit api Container — sharp Loads (Read-Only)

# One-off: does the DEPLOYED app-api container's sharp actually dlopen
# libvips? #329's CI break is `ERR_DLOPEN_FAILED` for libvips-cpp.so.8.17.3 in
# the jest job — the suite failing to run, not an assertion failing. That is
# a CI-runner question and the other lane owns it. This is the adjacent
# question nobody asked: sharp is load-bearing in production for two live
# routes (services/api/src/services/avatar.ts, called from
# POST /agents/:id/avatar and POST /profile/avatar), so if the RUNNING
# container has the same dlopen failure, avatar upload is broken in
# production right now — and nothing would say so, because no test exercises
# it against the real image and nobody has happened to upload an avatar
# since the deploy at 22a6b44 (~2026-08-04 15:20 UTC).
#
# READ-ONLY. `docker exec app-api node -e "require('sharp')"` and nothing
# else — no restart, no write, no state change on the host. `require()`
# alone is sufficient to trigger the same native dlopen the app's own code
# path does; sharp resolves and loads its native binding at require time, not
# at first call.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: does app-api's sharp load
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_APP_PATH: ${{ vars.VPS_APP_PATH || '/opt/hill90-app' }}

    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Setup SOPS/age
        env:
          SOPS_VERSION: "3.9.4"
        run: |
          SOPS_URL="https://github.com/getsops/sops/releases/download/v${SOPS_VERSION}/sops-v${SOPS_VERSION}.linux.amd64"
          curl -fsSL -o /tmp/sops "$SOPS_URL"
          if file /tmp/sops | grep -q "HTML"; then
            echo "::error::SOPS download returned HTML instead of binary — check URL: $SOPS_URL"
            exit 1
          fi
          chmod +x /tmp/sops
          sudo mv /tmp/sops /usr/local/bin/sops
          mkdir -p ~/.config/sops/age
          echo "${{ secrets.SOPS_AGE_KEY }}" > ~/.config/sops/age/keys.txt
          chmod 600 ~/.config/sops/age/keys.txt

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Tailscale IP from secrets
        id: get-ip
        run: |
          TAILSCALE_IP=$(sops -d --extract '["TAILSCALE_IP"]' infra/secrets/prod.enc.env)
          if [ -z "$TAILSCALE_IP" ]; then
            echo "::error::TAILSCALE_IP is empty or absent in infra/secrets/prod.enc.env"
            exit 1
          fi
          echo "::add-mask::$TAILSCALE_IP"
          echo "tailscale_ip=$TAILSCALE_IP" >> $GITHUB_OUTPUT

      - name: require('sharp') inside the running app-api container
        run: |
          ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            deploy@${{ steps.get-ip.outputs.tailscale_ip }} \
            "docker exec app-api node -e \"const s = require('sharp'); console.log('sharp OK, version', s.versions.sharp, 'vips', s.versions.vips);\""

name: Platform Baseline Freshness

# Does scripts/checks/hill90-platform-baseline.txt still match Hill90's OWN
# compose files?
#
# WHY THIS EXISTS (#177). That file is a hand-copied snapshot of Hill90's
# `container_name:` entries, taken once and never compared back to the
# source. Hill90#699 asked for the mirror of this check on the platform side
# and is blocked on a cross-repo PAT — Hill90 reading this (this repo is
# actually public, so that premise may not even hold any more, but that is
# Hill90#699's question to settle, not this workflow's). This runs from the
# OTHER side, and needs NO credential at all: Hill90 is a public repository,
# so this repo's own CI can read its compose files with a plain
# unauthenticated fetch. Same gap, closed from the side that does not need a
# secret — which is the whole reason this is worth doing before that PAT
# question is settled.
#
# WHAT THIS DOES NOT REPLACE. hill90-platform-baseline.txt's own header
# already explains why this tenant does not read Hill90's compose files
# LIVE, AT DEPLOY TIME, to build its own expectations — that would couple
# this tenant's deploy behaviour to the platform's internal file layout,
# exactly the boundary "the platform provides, the tenant consumes" exists
# to hold. This workflow's answer is never consulted by a deploy and does
# not change what scripts/checks/check_platform_baseline.sh compares
# against on the host. It only tells a human when the hand-copied snapshot
# has gone stale and needs a human to update it.
#
# PINNED, NOT FLOATING. Hill90's `main` is resolved to one commit SHA, ONCE,
# in the first step below — every later step (the tarball download, the
# check's own banner) uses that same resolved SHA, and the SHA is printed in
# the check's output. This is not a literal frozen historical commit (that
# would make the check flag drift for every unrelated Hill90 change forever,
# defeating its purpose — the point IS to compare against Hill90's current
# truth) — "pinned" means this run's comparison target is a single named,
# reproducible point in time rather than an implicit, silently-moving
# branch pointer that could resolve differently between two steps of the
# same run.
#
# NO MANUALLY-CONFIGURED SECRET. This talks to GitHub's public API and
# downloads a public tarball — nothing here touches the VPS, Tailscale, or
# any credential this repo manages or rotates. It DOES send the workflow's
# own ambient GITHUB_TOKEN on the commit-lookup call below (added
# 2026-08-06 — the unauthenticated call was hitting GitHub's 60-requests-
# per-hour-PER-IP limit, shared across every other tenant of the same
# GitHub-hosted Actions runner IP, not a limit this workflow's own traffic
# could exhaust alone). GITHUB_TOKEN is minted automatically for every
# workflow run; nothing was added to this repo's secrets store to make
# that authentication happen, and the token is never used for anything
# this repo doesn't already have read access to — see the step's own
# comment for why an unrelated repo's permission scope doesn't matter for
# a public-data read.

on:
  schedule:
    # Daily — matches Hill90's own tenant-baseline-agreement.yml cadence for
    # the same underlying fact (its container topology). Container additions
    # or removals are infrequent, deliberate changes, not the kind of
    # binary always-or-never state the hill90-ui secret-agreement check
    # watches — so there is a real grace window here, unlike that one.
    - cron: '45 6 * * *'
  pull_request:
    paths:
      - 'scripts/checks/hill90-platform-baseline.txt'
      - 'scripts/checks/check_platform_baseline_freshness.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    name: baseline agrees with Hill90
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Resolved ONCE. Every later step reads this output, not `main` again.
      #
      # Authenticated with the workflow's own GITHUB_TOKEN even though it
      # only ever reads jonhill90/Hill90 — a repo this token has no
      # permission grant for (this workflow's `permissions:` block above is
      # scoped to THIS repo, hill90-app). That is fine for this call
      # specifically: reading a PUBLIC repo's data over the REST API does
      # not require any repo-specific permission at all, and GitHub grants
      # the higher authenticated rate-limit tier to any authenticated
      # request regardless of which repo the token's permissions belong to.
      # Verified directly (not assumed from docs alone): an authenticated
      # GET to this exact endpoint for a repo other than the token's own
      # returned `x-ratelimit-limit: 5000`; the identical unauthenticated
      # call returned `x-ratelimit-limit: 60`. The 403 this workflow hit on
      # 2026-08-05 was that 60-per-hour budget — shared across every other
      # tenant of the same GitHub-hosted Actions runner IP — exhausted by
      # traffic that had nothing to do with this workflow.
      #
      # Also replaces `curl -f | python3 -c 'json.load(...)'`, which had a
      # second, separate defect: on a non-200 response, curl's `-f` prints
      # nothing to stdout and exits nonzero, but that happens INSIDE a pipe
      # feeding python3 — so python3 ran against empty input and crashed
      # with an uncaught JSONDecodeError instead of the clean
      # `::error::could not resolve...` message six lines below it, which
      # this exact failure mode meant that message could never actually
      # reach. The step still failed (bash's default `-e` for `run:` steps
      # meant the crash aborted the job), just not with a message anyone
      # could read. Reproduced locally against a guaranteed-404 URL before
      # this fix: identical shape — a curl error line, then a raw Python
      # traceback, then exit 1, and the intended ::error:: line never
      # printed. The status code is now read explicitly and checked before
      # any JSON parsing is attempted, so a non-200 fails on its own
      # ::error:: line, and a 200 with an unexpected body fails on a
      # different one.
      - name: Resolve Hill90 main to one commit
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          resp_file=$(mktemp)
          http_code=$(curl -sS -w '%{http_code}' -o "$resp_file" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/jonhill90/Hill90/commits/main)
          if [ "$http_code" != "200" ]; then
            echo "::error::GET /repos/jonhill90/Hill90/commits/main returned HTTP $http_code, not 200 — nothing was compared. Body: $(cat "$resp_file")"
            exit 1
          fi
          sha=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("sha",""))' < "$resp_file")
          if [ -z "$sha" ]; then
            echo "::error::got HTTP 200 but the response had no sha field — nothing was compared"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved Hill90 main -> $sha"

      # Deliberately NOT given the same auth-header treatment as the step
      # above. Checked, not assumed: the same tarball URL returned HTTP 200
      # both with and without an Authorization header, so this download
      # goes through codeload.github.com rather than api.github.com and
      # isn't drawing from the 60-per-hour budget that broke the step
      # above. Its existing `curl -fsSL ... -o <file>` also isn't piped
      # into a downstream parser, so a failure here already exits with
      # curl's own clear message under this job's default `bash -e` —
      # it doesn't have the swallowed-error shape the step above had.
      - name: Download Hill90's compose files at that commit
        env:
          HILL90_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          curl -fsSL "https://github.com/jonhill90/Hill90/archive/${HILL90_SHA}.tar.gz" -o /tmp/hill90.tar.gz
          mkdir -p /tmp/hill90-src
          # No --wildcards: that flag is GNU-tar-only and this only needs to
          # run once a day, so extracting the whole (small) tarball and
          # globbing the result afterward is worth the portability over the
          # marginal speed of a filtered extract.
          tar -xzf /tmp/hill90.tar.gz -C /tmp/hill90-src --strip-components=1
          ls /tmp/hill90-src/deploy/compose/prod/*.yml

      - name: Compare
        env:
          HILL90_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          python3 scripts/checks/check_platform_baseline_freshness.py \
            scripts/checks/hill90-platform-baseline.txt \
            /tmp/hill90-src/deploy/compose/prod/*.yml

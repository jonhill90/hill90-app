name: Validate Repository

# Manual-only by design: this repo has no deploy target, so nothing should fire
# on push. All jobs below were verified green locally on 2026-07-26.
on:
  workflow_dispatch:

jobs:
  shell:
    name: scripts (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats

      # Guards the production incident where the secrets loader silently exported
      # nothing: hill90.com served app-ui with a blank AUTH_SECRET and
      # /api/auth/signin returned 500. Deliberately needs no sops, age key or VPS.
      - name: Run bats tests
        run: bats tests/scripts/
  api:
    name: services/api (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  ui:
    name: services/ui (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  python:
    name: ${{ matrix.service }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/mcp
            args: ''
          - service: services/agentbox
            args: ''
          - service: services/ai
            args: ''
          # services/knowledge/tests/integration (18 files) needs a live
          # pgvector Postgres on localhost:5432 and is excluded here. Run it
          # against the local stack instead — see README, Running locally.
          - service: services/knowledge
            args: '--ignore=tests/integration'
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: poetry install --no-interaction
      - run: poetry run pytest ${{ matrix.args }}

name: Validate Repository

# Runs on every pull request. It did not, and that was a real gap.
#
# The old comment here said "manual-only by design: this repo has no deploy
# target, so nothing should fire on push". That rationale died the moment the
# pipeline started deploying to production, and it outlived it by long enough to
# be actively misleading: for a stretch, `validate-scripts.yml` was the ONLY
# workflow gating a pull request, so bats was the entire quality bar. (That
# workflow has since been folded in here as the `scripts` job and deleted, so
# there is no longer a second file to drift.) Pull
# requests changed `services/api` and `services/ui` source — and added tests to
# both — without a single jest or vitest test executing in CI. The tests existed;
# nothing ran them.
#
# workflow_dispatch is kept so the suite can still be run by hand against any
# branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# These are the tests, not a deploy: nothing here has a side effect outside the
# runner, so a superseded run is pure waste. Six jobs per push adds up quickly on
# a branch that gets several pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: services/api (jest)
    runs-on: ubuntu-latest
    services:
      # Only services/knowledge uses this; an unused container costs ~2s to start.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hill90_akm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AKM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hill90_akm_test
      # #350: built and controlled since round two of the 2026-08-03 flakiness
      # hunt, never once enabled here — a real 401 in CI could not have been
      # classified by an instrument that only ever ran on someone's laptop.
      # Permanently on, not available: an instrument nobody flips is the same
      # as one that doesn't exist. Measured cost against the full suite,
      # alternated to control for machine-load drift (4 runs without, 3 with):
      # ~15.27s mean without, ~15.26s mean with — noise, not a tradeoff being
      # made silently.
      AUTH_401_PROBE: '1'
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # #329's CI run: npm ci exited 0 having silently dropped an optional
      # native dependency (sharp's platform binary), and the first anyone
      # heard about it was an ERR_DLOPEN_FAILED five unrelated jest suites
      # later. This fails HERE, once, naming the cause — see
      # services/api/scripts/verify-native-deps.js for why it is a script
      # and not an npm flag.
      - run: node scripts/verify-native-deps.js
      - run: npm test

  ui:
    name: services/ui (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # Same defect class as services/api (#331): npm ci can silently drop an
      # optional native dependency to a registry hiccup and still exit 0. Of
      # this lockfile's seven native binary families, exactly two are
      # actually reachable from `npm test` — see verify-native-deps.js for
      # how the other five were ruled out by removing their binaries and
      # re-running the real suite, not by guessing from the lockfile.
      - run: node scripts/verify-native-deps.js
      - run: npm test

      # issue #117 is CI-ONLY: it has never reproduced locally in ~40 runs, so a
      # failure here is the only evidence there is, and re-running to provoke
      # another establishes nothing the issue does not already record. The
      # DashboardClient tests write test-artifacts/ on failure — the full
      # untruncated DOM, the fetch calls, and a verdict on whether the text
      # arrived late or never came. Collect it, or the next failure teaches us
      # exactly as much as the previous four did.
      #
      # if: always() rather than failure(), because the job is what fails, and a
      # future step between here and there would otherwise skip this silently.
      # if-no-files-found: ignore, because a green run writes nothing — that is
      # the design, not a fault.
      - name: Collect flake evidence (#117)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-flake-evidence
          path: services/ui/test-artifacts/
          if-no-files-found: ignore
          retention-days: 30

  python:
    name: ${{ matrix.service }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/mcp
            args: ''
          - service: services/agentbox
            args: ''
          - service: services/ai
            args: ''
          # services/knowledge/tests/integration (19 files, 98 tests) needs a live
          # pgvector Postgres. It ran NOWHERE from 2026-07-26 (#1) until now, and in
          # that window it was hiding a real 500: /internal/admin/shared/stats?since=
          # passed a str to asyncpg, which requires a datetime. A regression test that
          # never runs is a check attached to nothing.
          - service: services/knowledge
            args: ''
            # pgvector's image ships the extension but does not enable it per-database.
            setup: 'PGPASSWORD=postgres psql -h localhost -U postgres -d hill90_akm_test -c "CREATE EXTENSION IF NOT EXISTS vector;"'
    services:
      # Used only by the services/knowledge arm; the other three ignore it and it
      # costs a couple of seconds to start. tests/integration needs a real pgvector
      # Postgres — see docs and the comment on the matrix entry below.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hill90_akm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AKM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hill90_akm_test
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: poetry install --no-interaction
      - name: Enable pgvector (knowledge only)
        if: matrix.setup != ''
        run: ${{ matrix.setup }}
      - run: poetry run pytest ${{ matrix.args }}

  # Lint had NEVER run here. `grep -c lint ci.yml` returned 0 while all three
  # services declared a lint entry point, and all three were broken:
  # services/api had no eslint config at all, services/ui called `next lint`
  # which Next 16 removed, and ruff failed across three of the four Python
  # services. A declared-but-uninvoked guard is the same dead shape as a rule
  # that cannot fire.
  #
  # One job rather than steps bolted onto the test jobs, so a lint failure is
  # legible as a lint failure in the checks list rather than hiding inside
  # "services/api (jest)".
  lint:
    name: lint (api, ui, python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint services/api (eslint)
        working-directory: services/api
        run: |
          npm ci
          npm run lint

      - name: Lint services/ui (eslint)
        working-directory: services/ui
        run: |
          npm ci
          npm run lint

      - name: Install poetry
        run: pipx install poetry

      # Every Python service, not just the first to fail. The `make lint-python`
      # loop exits on the first bad service, which is why an earlier report said
      # the Python problem was one F401 in services/mcp when it was 53 findings
      # across three services.
      - name: Lint Python services (ruff)
        run: |
          failed=""
          for s in services/mcp services/agentbox services/ai services/knowledge; do
            echo "::group::$s"
            (cd "$s" && poetry install --no-interaction --quiet && poetry run ruff check .) || failed="$failed $s"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::ruff failed in:$failed"
            exit 1
          fi

      # Proves the three arms above can actually FAIL, by injecting a violation
      # into each and asserting it is reported. This runs last because it reuses
      # the installs the steps above already did.
      #
      # It exists because the ui arm shipped in #95 unable to catch anything:
      # eslint-config-next omits eslint:recommended, so `no-debugger` was not
      # configured and a deliberate `debugger;` linted clean. That was found by
      # injecting a violation BY HAND, and it survived review because the check
      # was a one-off that ran after the pull request had already merged.
      #
      # A non-zero exit is not accepted as proof: the arm must also NAME the rule
      # that was supposed to fire, so missing dependencies or a broken config
      # cannot masquerade as a working guard.
      - name: Prove the lint arms can fail
        run: bash scripts/checks/lint-selftest.sh

  # Folded in from validate-scripts.yml, which was deleted in the same change.
  #
  # That workflow existed because ci.yml was once workflow_dispatch-only, so a
  # shell job added here would never have run on a pull request. ci.yml now runs
  # on every pull request (see the header), so the reason for a second workflow
  # is gone, and two files triggering on the same events is just somewhere for
  # them to drift apart.
  #
  # The job name is kept byte-identical to the old one so the check reads the same
  # in the PR list. Confirmed before deleting: nothing referenced the workflow by
  # `uses:` or by name, and no branch protection rule could require its check —
  # branch protection and rulesets are both unavailable on this repository's plan
  # (private, and the API returns "Upgrade to GitHub Pro or make this repository
  # public"). Verified as a real answer rather than a failed call by running the
  # same request against the public Hill90 repo, where it succeeds and returns
  # required_status_checks.contexts = ["Run Tests"].
  cli:
    name: services/cli (go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The CLI had tests and no job. Eight of them, plus the client's own, ran
      # only on whoever remembered to type `go test` — so they were decoration:
      # a check that cannot fire, the same class as an alert rule that matches
      # nothing production emits. Converting them into a gate is worth more than
      # the tests were, because until now the CLI could be broken arbitrarily and
      # every check stayed green.
      #
      # Found by auditing the day's merges for durability rather than for defects.
      - uses: actions/setup-go@v5
        with:
          # Matches services/knowledge/cli/go.mod. A mismatch here fails on a
          # toolchain download rather than on the code, which reads as flakiness.
          go-version-file: services/knowledge/cli/go.mod
          cache-dependency-path: services/knowledge/cli/go.sum

      - name: Build
        working-directory: services/knowledge/cli
        run: go build ./...

      - name: Vet
        working-directory: services/knowledge/cli
        run: go vet ./...

      # ./... rather than ./cmd/: a package added later would otherwise be
      # skipped silently, which is how this job came to be needed.
      #
      # The grep is not decoration. `go test` on a tree with no test files prints
      # "no test files" and EXITS 0, so a job that merely runs it stays green
      # after someone deletes the last test — a gate that cannot fire, which is
      # the exact fault this job was added to fix. Requiring at least one passing
      # package makes the gate prove it ran something.
      - name: Test
        working-directory: services/knowledge/cli
        run: |
          go test ./... -count=1 | tee /tmp/go-test.out
          grep -q '^ok ' /tmp/go-test.out || {
            echo "::error::go test ran but no package reported ok — the CLI has no tests, or none were found"
            exit 1
          }

  sql-identifiers:
    name: sql identifiers (api)
    runs-on: ubuntu-latest
    # WHY A JOB AND NOT A STEP IN `api`. That job mocks the pool, which is why
    # this class of defect was invisible to it: two endpoints answered 500 on
    # every call since the day they were written, and 97 test files could not
    # see it (#286, #290). This job exists to look at the SQL itself, so its
    # red must mean "a statement does not parse" and nothing else.
    #
    # THE SCHEMA COMES FROM THE MIGRATIONS, not from a checked-in dump. A dump
    # is a second source of truth that drifts silently — the same defect one
    # level up — and it would go stale the first time someone adds a column
    # without regenerating it. Applying `src/db/migrations/*.sql` in order means
    # a new migration is covered the day it lands, with nothing to remember.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hill90_api_schema
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hill90_api_schema
    steps:
      - uses: actions/checkout@v4
      - name: Ensure a psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Build the schema from the migrations
        # INFRASTRUCTURE FAILS HERE, not in the check. The service is
        # health-gated and this step touches the database, so an unreachable or
        # broken database turns this step red — and the check below therefore
        # runs only when the database is proven up.
        #
        # `uuid-ossp` is created here because migration 001 uses
        # uuid_generate_v4() and no migration creates the extension: in
        # production the platform's Postgres bootstrap does it. That the schema
        # is not self-contained is worth knowing, and this is the one place it
        # is written down.
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
          # `schema_migrations` is created by the migration RUNNER at boot
          # (src/db/migrate.ts), not by a migration file — so applying the files
          # alone leaves it absent and the check reddens on migrate.ts's own two
          # statements. Mirrored here because it is part of the real schema; the
          # widening of the check to src/db is what surfaced this.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE TABLE IF NOT EXISTS schema_migrations (filename VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMPTZ NOT NULL DEFAULT NOW());'
          for f in $(ls services/api/src/db/migrations/*.sql | sort); do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Every static statement must parse against that schema
        # EXIT CODES, and the one that needed a decision:
        #   0  every checkable statement parsed          -> green
        #   1  a statement does not parse                -> RED, the point of the job
        #   2  CANNOT DETERMINE (no database reachable)  -> RED, deliberately
        #
        # The case for 2 passing: a database that is slow or briefly unavailable
        # would redden unrelated pull requests, and a check that reddens for
        # reasons the author cannot fix is a check someone disables.
        #
        # The case for 2 failing, which is what this does: a CANNOT DETERMINE
        # that passes silently IS a check that has stopped running, and nobody
        # finds out until the next #286 — which is exactly what happened to the
        # two endpoints this job exists to catch. The repository already has the
        # rule written down for the drift alarm: never silent, never green.
        #
        # WHAT MAKES IT SURVIVE rather than get disabled: the failure modes are
        # SEPARATED. The database is health-gated by the runner and proven by
        # the step above, so an infrastructure problem is red on "Build the
        # schema", with a psql error, before this step runs at all. By the time
        # the check executes, a 2 means something genuinely new — and that is
        # worth a human. If this ever does start flapping, the fix is to make
        # the database more reliable, not to make the check quieter.
        run: bash scripts/checks/check_sql_identifiers.sh

  scripts:
    name: scripts (bats)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than `apt-get install bats`. The apt version is 1.2.1 on
      # ubuntu-22.04, which predates BATS_TEST_TMPDIR (bats 1.4.0) — the suite
      # would break on a runner-image change rather than on a code change.
      - name: Install bats (pinned)
        run: |
          # sudo: the runner's global npm prefix is /usr/local, which the runner
          # user cannot write. Caught by this job's own first run.
          sudo npm install -g bats@1.11.0
          bats --version

      # Guards the class, not the instances. Thirteen dead internal links had
      # accumulated because nothing looked: the extraction brought this repo's
      # architecture and runbook docs across and left the platform's behind, so
      # their relative links pointed at siblings that were no longer here. A dead
      # internal link is the first thing that makes a docs tree look abandoned,
      # which matters for a repository that may go public.
      - name: Markdown links resolve
        run: python3 scripts/checks/check_md_links.py

      - name: Shell syntax
        run: |
          for f in scripts/*.sh scripts/checks/*.sh tests/scripts/*.sh; do
            bash -n "$f" && echo "ok  $f"
          done

      # Recursive: `bats tests/scripts/` is non-recursive, so a test added in a
      # subdirectory would be skipped silently.
      - name: Run bats tests
        run: bats --recursive tests/scripts/

      # The standalone realm is a VENDORED copy of Hill90's platform-realm.json,
      # and a copy is safe only while something keeps it honest. Compares the
      # load-bearing fields against a committed extract of upstream, so this needs
      # neither the Hill90 checkout nor the network — see the script's header for
      # what that trades away and how staleness is detected.
      - name: Vendored realm has not drifted from Hill90's
        run: python3 scripts/checks/check_vendored_realm.py

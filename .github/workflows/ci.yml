name: Validate Repository

# Runs on every pull request. It did not, and that was a real gap.
#
# The old comment here said "manual-only by design: this repo has no deploy
# target, so nothing should fire on push". That rationale died the moment the
# pipeline started deploying to production, and it outlived it by long enough to
# be actively misleading: for a stretch, `validate-scripts.yml` was the ONLY
# workflow gating a pull request, so bats was the entire quality bar. Pull
# requests changed `services/api` and `services/ui` source — and added tests to
# both — without a single jest or vitest test executing in CI. The tests existed;
# nothing ran them.
#
# workflow_dispatch is kept so the suite can still be run by hand against any
# branch.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# These are the tests, not a deploy: nothing here has a side effect outside the
# runner, so a superseded run is pure waste. Six jobs per push adds up quickly on
# a branch that gets several pushes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: services/api (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  ui:
    name: services/ui (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  python:
    name: ${{ matrix.service }} (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/mcp
            args: ''
          - service: services/agentbox
            args: ''
          - service: services/ai
            args: ''
          # services/knowledge/tests/integration (18 files) needs a live
          # pgvector Postgres on localhost:5432 and is excluded here. Run it
          # against the local stack instead — see README, Running locally.
          - service: services/knowledge
            args: '--ignore=tests/integration'
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pipx install poetry
      - run: poetry install --no-interaction
      - run: poetry run pytest ${{ matrix.args }}
